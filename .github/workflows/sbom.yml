name: Resolved SBOM

on:
  pull_request:
    paths:
      - .github/workflows/sbom.yml
      - scripts/ci/validate-sbom-artifacts.mjs
      - pom.xml
      - '**/pom.xml'
      - analyst-console-ui/package.json
      - analyst-console-ui/package-lock.json
      - ml-inference-service/requirements.txt
  push:
    branches:
      - master
    paths:
      - .github/workflows/sbom.yml
      - scripts/ci/validate-sbom-artifacts.mjs
      - pom.xml
      - '**/pom.xml'
      - analyst-console-ui/package.json
      - analyst-console-ui/package-lock.json
      - ml-inference-service/requirements.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolved-sbom:
    name: Generate resolved CycloneDX SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analyst-console-ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-inference-service/requirements.txt

      - name: Generate Maven resolved SBOM
        run: |
          mkdir -p target/sbom
          mvn -B -DskipTests \
            -Dproject.build.outputTimestamp=0 \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom \
            -DschemaVersion=1.6 \
            -DoutputFormat=json \
            -DoutputName=maven-resolved \
            -DoutputDirectory=target/sbom \
            -DincludeBomSerialNumber=false \
            -DincludeTestScope=true \
            -DoutputReactorProjects=false
          mv target/sbom/maven-resolved.json target/sbom/maven-resolved.cdx.json

      - name: Generate npm resolved SBOM
        working-directory: analyst-console-ui
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 \
            --package-lock-only \
            --output-reproducible \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file ../target/sbom/npm-analyst-console-ui.cdx.json \
            package.json

      - name: Generate Python resolved SBOM
        run: |
          python -m venv .venv-sbom-ml
          .venv-sbom-ml/bin/python -m pip install --upgrade pip
          .venv-sbom-ml/bin/python -m pip install -r ml-inference-service/requirements.txt
          python -m pip install cyclonedx-bom==7.3.1
          cyclonedx-py environment \
            --output-reproducible \
            --sv 1.6 \
            --of JSON \
            -o target/sbom/python-ml-inference-service.cdx.json \
            .venv-sbom-ml/bin/python

      - name: Validate SBOM artifacts
        run: node scripts/ci/validate-sbom-artifacts.mjs target/sbom/*.cdx.json

      - name: Upload resolved SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resolved-cyclonedx-sbom-${{ github.sha }}
          path: target/sbom/*.json
          retention-days: 30
