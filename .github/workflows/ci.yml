  fdp36-real-chaos:
    name: FDP-36 Real Alert-Service Kill Proof
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Build patched Kafka image for Testcontainers
        uses: ./.github/actions/build-kafka-test-image

      - name: Run FDP-36 real alert-service kill suite
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dgroups=real-chaos,docker-chaos,service-chaos,integration" "-Dtest=RegulatedMutationRealAlertServiceChaosIT,RegulatedMutationRealAlertServiceEvidenceIntegrityIT,RegulatedMutationLiveInFlightKillIT" test

      - name: Verify FDP-36 proof artifacts
        if: always()
        env:
          FDP36_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/verify-fdp36-artifacts.mjs

      - name: Upload FDP-36 real chaos reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp36-real-chaos-test-reports
