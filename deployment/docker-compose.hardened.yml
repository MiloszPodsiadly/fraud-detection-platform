# Application container hardening overlay for local verification; not a production deployment.
# Covers Java app services, local key loaders, ML inference and analyst-console-ui.
# Kafka, MongoDB, Redis, Prometheus, Grafana, Keycloak and optional Ollama are outside this overlay.
x-java-hardening: &java-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  audit-trust-authority:
    <<: *java-hardening

  audit-trust-key-loader:
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=6m

  transaction-ingest-service:
    <<: *java-hardening

  transaction-simulator-service:
    <<: *java-hardening

  feature-enricher-service:
    <<: *java-hardening

  fraud-scoring-service:
    <<: *java-hardening

  alert-service:
    <<: *java-hardening

  model-promotion-policy-publisher:
    <<: *java-hardening

  # Loaders need CHOWN, DAC_OVERRIDE and FOWNER to refresh protected files for uid 10001.
  # They have no network and no writable filesystem apart from their dedicated key volumes.
  model-promotion-policy-key-loader:
    profiles: [policy-trust-loader]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=6m

  model-promotion-observation-key-loader:
    profiles: [policy-trust-loader]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=6m

  ml-inference-service:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  analyst-console-ui:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,uid=101,gid=101,mode=0755
