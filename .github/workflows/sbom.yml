name: Resolved SBOM

on:
  workflow_call:

permissions:
  contents: read

jobs:
  resolved-sbom:
    name: Generate resolved CycloneDX SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load central security policy
        id: security-policy
        run: node scripts/security/run-security-gate.mjs policy --github-output "$GITHUB_OUTPUT"

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.security-policy.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            analyst-console-ui/package-lock.json
            scripts/security/sbom/npm-sbom-tools/package-lock.json

      - name: Install verified patched npm
        run: node scripts/security/run-security-gate.mjs pinned-npm-install

      - name: Install locked npm SBOM generator and schema validator
        working-directory: scripts/security/sbom/npm-sbom-tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit the complete locked npm SBOM toolchain
        working-directory: scripts/security/sbom/npm-sbom-tools
        run: node ../../../scripts/security/run-security-gate.mjs npm-sbom-audit ../../../target/sbom/npm-sbom-toolchain-audit.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.security-policy.outputs.python_version }}
          pip-version: ${{ steps.security-policy.outputs.pip_version }}
          cache: pip
          cache-dependency-path: ml-inference-service/requirements.txt

      - name: Generate Maven resolved SBOM
        run: node scripts/security/run-security-gate.mjs maven-sbom-generation

      - name: Generate npm resolved SBOM
        working-directory: analyst-console-ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ../scripts/security/sbom/npm-sbom-tools/node_modules/.bin/cyclonedx-npm \
            --package-lock-only \
            --output-reproducible \
            --spec-version 1.6 \
            --output-format JSON \
            --validate \
            --output-file ../target/sbom/npm-analyst-console-ui.cdx.json \
            package.json

      - name: Generate Python resolved SBOM
        env:
          PYTHON: ${{ github.workspace }}/.venv-sbom-ml/bin/python
        run: |
          python -m venv .venv-sbom-ml
          .venv-sbom-ml/bin/python -m pip install --upgrade --require-hashes --no-deps -r deployment/python-build-tools-requirements.txt
          .venv-sbom-ml/bin/python -m pip install --require-hashes --only-binary=:all: -r ml-inference-service/requirements.txt
          node scripts/security/run-security-gate.mjs pinned-cyclonedx-install
          cyclonedx-py environment \
            --output-reproducible \
            --validate \
            --sv 1.6 \
            --of JSON \
            -o target/sbom/python-ml-inference-service.cdx.json \
            .venv-sbom-ml/bin/python

      - name: Validate SBOM artifacts
        env:
          TESTED_GIT_SHA: ${{ github.sha }}
          SBOM_PYTHON: ${{ github.workspace }}/.venv-sbom-ml/bin/python
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_GIT_SHA"
          node scripts/security/run-security-gate.mjs sbom-validation target/sbom/*.cdx.json

      - name: Upload resolved SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-cyclonedx-sbom-${{ github.sha }}
          path: |
            target/sbom/*.json
            **/target/maven-dependency-tree.json
            **/target/maven-plugin-dependencies.txt
          if-no-files-found: error
          retention-days: ${{ steps.security-policy.outputs.artifact_retention_days }}
