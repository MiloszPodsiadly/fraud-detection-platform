name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Maven Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for CI selector validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Validate CI test selectors
        run: node scripts/ci/verify-ci-test-selectors.mjs

      - name: Test CI selector guard fail-closed behavior
        run: node --test scripts/ci/verify-ci-test-selectors.test.mjs

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Build patched Kafka image for Testcontainers
        uses: ./.github/actions/build-kafka-test-image

      - name: Use canonical ready shadow model artifact for backend tests
        run: cp ml-inference-service/app/model_artifact.json /tmp/model_artifact.json

      - name: Generate local identity fixtures and manifests for backend tests
        run: bash scripts/bootstrap-local-fixtures.sh

      - name: Build and test backend modules
        run: mvn -B -U verify -Dproject.root=${{ github.workspace }} -Dsurefire.failIfNoSpecifiedTests=false

  graph-signed-e2e:
    name: Signed Graph to scorer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record exact tested revision
        run: |
          TESTED_GIT_SHA=$(git rev-parse HEAD)
          test "$TESTED_GIT_SHA" = "$GITHUB_SHA"
          echo "TESTED_GIT_SHA=$TESTED_GIT_SHA" >> "$GITHUB_ENV"
          echo "Signed Graph E2E revision: $TESTED_GIT_SHA"

      - name: Set up Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Verify Docker is available for signed owner fixtures
        run: docker version

      - name: Run the live signed Graph-to-scorer proof
        run: mvn -B -Pgraph-signed-e2e -pl fraud-scoring-service -am -Dtest=GraphRiskSignalEngineSignedMongoE2ETest,GraphRiskSignalEngineSignedDenseMongoE2ETest -Dsurefire.failIfNoSpecifiedTests=false verify

      - name: Require the live E2E report to contain a passing, non-skipped test
        run: |
          REPORT=fraud-scoring-service/target/surefire-reports/TEST-com.frauddetection.scoring.graph.GraphRiskSignalEngineSignedMongoE2ETest.xml
          test -f "$REPORT"
          grep -Eq '<testsuite[^>]*tests="[1-9][0-9]*"' "$REPORT"
          grep -Eq '<testsuite[^>]*failures="0"' "$REPORT"
          grep -Eq '<testsuite[^>]*errors="0"' "$REPORT"
          grep -Eq '<testsuite[^>]*skipped="0"' "$REPORT"

      - name: Require the real signed dense-owner report to contain a passing, non-skipped test
        run: |
          REPORT=fraud-scoring-service/target/surefire-reports/TEST-com.frauddetection.scoring.graph.GraphRiskSignalEngineSignedDenseMongoE2ETest.xml
          test -f "$REPORT"
          grep -Eq '<testsuite[^>]*tests="1"' "$REPORT"
          grep -Eq '<testsuite[^>]*failures="0"' "$REPORT"
          grep -Eq '<testsuite[^>]*errors="0"' "$REPORT"
          grep -Eq '<testsuite[^>]*skipped="0"' "$REPORT"
          grep -q 'name="realSignedHundredPriorHubMeasuresOwnerAndDatabaseCostUnderTheScorerDeadline"' "$REPORT"

      - name: Run the dense single-hub Graph benchmark
        run: |
          MAVEN_VERSION="$(mvn -version | awk 'NR == 1 {print $3}')"
          mvn -B -pl feature-enricher-service -am \
            -Dtest=MongoGraphProjectionWorkloadTest#singleHubDenseTwoHopMeasuresVerifiedAndTruncatedBounds \
            -Dgraph.twoHop.denseBenchmark=true \
            "-Dbenchmark.maven.version=${MAVEN_VERSION}" \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Require the dense benchmark report to contain its passing, non-skipped selector
        run: |
          REPORT=feature-enricher-service/target/surefire-reports/TEST-com.frauddetection.enricher.graph.MongoGraphProjectionWorkloadTest.xml
          test -f "$REPORT"
          grep -Eq '<testsuite[^>]*tests="1"' "$REPORT"
          grep -Eq '<testsuite[^>]*failures="0"' "$REPORT"
          grep -Eq '<testsuite[^>]*errors="0"' "$REPORT"
          grep -Eq '<testsuite[^>]*skipped="0"' "$REPORT"
          grep -q 'name="singleHubDenseTwoHopMeasuresVerifiedAndTruncatedBounds"' "$REPORT"

  institutional-reliability:
    name: Institutional Reliability Proof
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record exact tested revision
        run: |
          TESTED_GIT_SHA=$(git rev-parse HEAD)
          test "$TESTED_GIT_SHA" = "$GITHUB_SHA"
          echo "TESTED_GIT_SHA=$TESTED_GIT_SHA" >> "$GITHUB_ENV"
          echo "Institutional reliability revision: $TESTED_GIT_SHA"

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Build patched Kafka image for Testcontainers
        uses: ./.github/actions/build-kafka-test-image

      - name: Run institutional reliability suite
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dtest=EngineIntelligencePendingProjectionReliabilityIntegrationTest,ScoringOccurrenceProcessingMongoIntegrationTest,FraudFeedbackOccurrenceSnapshotMongoIntegrationTest,FraudAlertOutboxKafkaReliabilityIntegrationTest,EngineIntelligenceApiArchitectureGuardTest,EngineIntelligenceReadControllerSerializationTest,EngineIntelligenceOperationalMetricsCardinalityTest" test

      - name: Verify institutional reliability reports
        if: always()
        run: node scripts/ci/verify-junit-reports.mjs --suite institutionalReliability

      - name: Upload institutional reliability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: institutional-reliability-${{ env.TESTED_GIT_SHA }}
          if-no-files-found: error
          path: alert-service/target/surefire-reports/

  fdp42-fraud-case-management:
    name: FDP-42 Fraud Case Management
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Run FDP-42 fraud case proof suite
        run: mvn -B "-Dsurefire.failIfNoSpecifiedTests=false" -pl alert-service -am "-Dtest=FraudCaseControllerTest,FraudCaseManagementServiceTest,FraudCaseMutationInvariantTest,FraudCasePatchRegulatedMutationProofTest,FraudCaseRemovedRouteRuntimeTest,FraudCaseRemovedApiSurfaceTest,FraudCaseCurrentApiSurfaceTest,FraudCaseSecurityIntegrationTest,AlertSecurityConfigTest,AlertSecurityConfigJwtEnabledTest,DemoAuthSecurityConfigTest,AnalystRoleTest" test

      - name: Verify FDP-42 proof suite reports
        run: node scripts/ci/verify-junit-reports.mjs --suite fdp42

      - name: Upload FDP-42 test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp42-fraud-case-management-test-reports
          if-no-files-found: error
          path: |
            alert-service/target/surefire-reports/
            alert-service/target/failsafe-reports/

  fdp45-fraud-case-work-queue-read-model:
    name: FDP-45 Fraud Case Work Queue Read Model
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - fdp42-fraud-case-management
      - regulated-mutation-regression

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Run FDP-45 fraud case work queue read model suite
        run: >-
          mvn -B "-Dsurefire.failIfNoSpecifiedTests=false" -pl alert-service -am
          "-Dtest=FraudCaseReadModelSingleSourceOfTruthTest,FraudCaseWorkQueuePaginationTest,FraudCaseWorkQueueSortingTest,FraudCaseWorkQueueFilterTest,FraudCaseWorkQueueDuplicateParamTest,FraudCaseWorkQueueSlaConfigTest,FraudCaseProdSlaConfigTest,FraudCaseWorkQueueSlaAgeTest,FraudCaseWorkQueueReadOnlySafetyTest,FraudCaseWorkQueueSecurityTest,FraudCaseWorkQueueObservabilityTest,FraudCaseWorkQueueFailureMetricsTest,FraudCaseWorkQueueReadAccessAuditTest,FraudCaseWorkQueueMongoIntegrationTest,FraudCaseWorkQueueDocsNoOverclaimTest,FraudCaseWorkQueueDeepPaginationTest,FraudCaseWorkQueueIndexReadinessTest,FraudCaseWorkQueueOpenApiContractTest,FraudCaseWorkQueueFailedReadAuditTest,FraudCaseWorkQueueFilterLengthTest,FraudCaseWorkQueueNoDuplicateAuditAdviceTest,ReadAccessAuditResponseAdviceMarkerTest,FraudCaseWorkQueueAuditPrecedenceTest,SensitiveReadAuditUnavailableRunbookTest,FraudCaseReadPolicyNamingBoundaryTest,FraudCaseRemovedListExactCountGuardTest,FraudCaseReadQueryPolicyContractTest,FraudCaseWorkQueueCursorArchitectureTest,FraudCaseWorkQueueCursorCodecTest,FraudCaseWorkQueueCursorPaginationTest,FraudCaseWorkQueueCursorQueryFingerprintTest,FraudCaseWorkQueueCursorFilterBindingTest,FraudCaseWorkQueueCursorPageCombinationTest,FraudCaseWorkQueueCursorSecretProfileTest,FraudCaseWorkQueueCursorObservabilityTest,FraudCaseWorkQueueSortFieldCoverageTest,FraudCaseWorkQueueCursorSizeChangeTest,SensitiveReadAuditServiceTest"
          test

      - name: Verify FDP-45 proof suite reports
        run: node scripts/ci/verify-junit-reports.mjs --suite fdp45

      - name: Upload FDP-45 test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp45-fraud-case-work-queue-read-model-test-reports
          if-no-files-found: error
          path: |
            alert-service/target/surefire-reports/
            alert-service/target/failsafe-reports/

  ml:
    name: Python ML Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          pip-version: "26.3"

      - name: Install ML dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ml-inference-service/requirements.txt

      - name: Generate local identity fixtures for ML tests
        run: bash scripts/bootstrap-local-fixtures.sh

      - name: Run ML unit tests
        run: python -m unittest discover -s ml-inference-service/tests
        env:
          PYTHONPATH: ml-inference-service

      - name: Validate trained model artifact loads
        run: python -m app.train_model --examples 5000 --epochs 1100 --output /tmp/model_artifact.json
        env:
          PYTHONPATH: ml-inference-service

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: analyst-console-ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: analyst-console-ui/package-lock.json

      - name: Install verified patched npm
        run: bash ../scripts/ci/install-pinned-npm.sh

      - name: Install dependencies securely
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          npm ci --ignore-scripts

      - name: Verify generated authority constants
        run: npm run check:authorities

      - name: Run frontend tests
        run: npm test

      - name: Build UI
        run: npm run build

  frontend-dependency-audit:
    name: Frontend npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: analyst-console-ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Install verified patched npm
        run: bash ../scripts/ci/install-pinned-npm.sh

      - name: Audit production and development dependencies
        run: |
          mkdir -p ../target/security
          npm audit --audit-level=high --json > ../target/security/npm-audit.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-${{ github.sha }}
          path: target/security/npm-audit.json
          if-no-files-found: error
          retention-days: 30

  python-dependency-audit:
    name: Python pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for isolated audit tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - name: Set up Node for audit evidence validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Install verified pip-audit CLI in an isolated environment
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/ci/install-pinned-pip-audit.mjs

      - name: Add isolated pip-audit CLI to PATH
        run: printf '%s\n' "$RUNNER_TEMP/pip-audit-venv/bin" >> "$GITHUB_PATH"

      - name: Audit every hash-locked Python package and validate JSON evidence
        run: node scripts/ci/run-pip-audit.mjs

      - name: Upload available pip-audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip-audit-${{ github.sha }}
          path: target/security/pip-audit*
          if-no-files-found: warn
          retention-days: 30

  fdp28-proof:
    name: FDP-28 Docker Integration Proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Build patched Kafka image for Testcontainers
        uses: ./.github/actions/build-kafka-test-image

      - name: Run FDP-28 proof suite with Testcontainers
        run: mvn -B -pl alert-service -am -Dgroups=failure-injection,invariant-proof,integration test

  fdp35-production-readiness:
    name: FDP-35 Production Readiness Proof
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Build patched Kafka image for Testcontainers
        uses: ./.github/actions/build-kafka-test-image

      - name: Run FDP-35 proof suite
        run: mvn -B -pl alert-service -am -Dgroups=production-readiness,e2e,recovery-proof,integration test

      - name: Upload FDP-35 test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp35-production-readiness-test-reports
          if-no-files-found: ignore
          path: |
            alert-service/target/surefire-reports/
            alert-service/target/failsafe-reports/

  fdp47-analyst-console-ux-and-summary:
    name: Analyst Console Product Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - frontend
      - fdp45-fraud-case-work-queue-read-model

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: analyst-console-ui/package-lock.json

      - name: Install verified patched npm
        run: bash scripts/ci/install-pinned-npm.sh

      - name: Ensure FDP-47 tests are not skipped
        run: node scripts/ci/guard-test-activation.mjs --suite fdp47

      - name: Run FDP-46 backend search and audit tests
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dtest=ScoredTransactionControllerValidationTest,ScoredTransactionSearchPolicyTest,TransactionMonitoringServiceSearchTest,ScoredTransactionDocumentMapperTest,ScoredTransactionSearchIndexReadinessTest,ReadAccessAuditClassifierTest,ReadAccessAuditEndpointTest,ReadAccessAuditServiceTest,ReadAccessAuditResponseAdviceTest,ReadAccessAuditResponseAdviceMarkerTest,AlertServiceMetricsTest,AlertSecurityConfigTest" test

      - name: Verify FDP-46 backend test reports
        run: node scripts/ci/verify-junit-reports.mjs --suite fdp46

      - name: Run FDP-47 backend summary tests
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dtest=FraudCaseWorkQueueSummaryControllerTest,ReadAccessAuditClassifierTest,ReadAccessResultCountExtractorTest,FraudCaseReadModelSingleSourceOfTruthTest,FraudCaseWorkQueueReadOnlySafetyTest,FraudCaseWorkQueueOpenApiContractTest,FraudCaseWorkQueueSummaryContractTest,FraudCaseWorkQueueObservabilityTest,FraudCaseSecurityIntegrationTest" test

      - name: Verify FDP-47 backend test reports
        run: node scripts/ci/verify-junit-reports.mjs --suite fdp47

      - name: Install frontend dependencies securely
        working-directory: analyst-console-ui
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          npm ci --ignore-scripts

      - name: Run FDP-47 frontend tests
        working-directory: analyst-console-ui
        run: npm test -- --run src/App.test.jsx src/pages/AlertsListPage.test.jsx src/components/FraudCaseWorkQueuePanel.test.jsx src/api/alertsApi.test.js

      - name: Build FDP-47 UI
        working-directory: analyst-console-ui
        run: npm run build

  fdp48-bff-session-request-lifecycle:
    name: FDP-48 BFF Session & Request Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
      - fdp47-analyst-console-ux-and-summary

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: analyst-console-ui/package-lock.json

      - name: Install verified patched npm
        run: bash scripts/ci/install-pinned-npm.sh

      - name: Ensure FDP-48 tests are not skipped
        run: node scripts/ci/guard-test-activation.mjs --suite fdp48

      - name: Run FDP-48 backend BFF security tests
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dtest=BffSessionSecurityIntegrationTest,BffSecurityPropertiesTest,BffLogoutSuccessHandlerTest,OidcAnalystAuthoritiesMapperTest,AlertSecurityConfigJwtEnabledTest,AlertServiceMetricsTest" test

      - name: Verify FDP-48 backend reports
        run: node scripts/ci/verify-junit-reports.mjs --suite fdp48

      - name: Install frontend dependencies securely
        working-directory: analyst-console-ui
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          npm ci --ignore-scripts

      - name: Run FDP-48 frontend lifecycle tests
        working-directory: analyst-console-ui
        run: npm test -- --run src/auth/authProvider.test.js src/api/alertsApi.test.js src/fraudCases/useFraudCaseWorkQueue.test.js src/fraudCases/useFraudCaseWorkQueueSummary.test.js src/workspace/workspaceDataHooks.test.js src/workspace/useWorkspaceRoute.test.js --reporter=default --reporter=junit --outputFile=./test-results/fdp48-vitest.xml

      - name: Guard FDP-48 API client boundary
        working-directory: analyst-console-ui
        run: npm run check:api-client-boundary

      - name: Verify FDP-48 frontend report
        run: node scripts/ci/verify-vitest-reports.mjs --suite fdp48

      - name: Build FDP-48 UI
        working-directory: analyst-console-ui
        run: npm run build

  security-route-boundary:
    name: Security Route Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
      - fdp48-bff-session-request-lifecycle

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: analyst-console-ui/package-lock.json

      - name: Install verified patched npm
        run: bash scripts/ci/install-pinned-npm.sh

      # Post-BFF route/auth boundaries remain required for merge.
      - name: Ensure security route boundary tests are not skipped
        run: node scripts/ci/guard-test-activation.mjs --suite securityRouteBoundary

      - name: Run backend security route tests
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dtest=AuthorizationRulesCoverageTest,AuthorizationRuleGroupRegistrationTest,RouteCoverageAgainstMvcMappingsTest,SecurityMatcherOrderRegressionTest,DenyByDefaultSecurityTest,SpaFallbackSecurityTest,BffCsrfBoundaryRegressionTest,BearerVsSessionCsrfRegressionTest,BffSessionSecurityIntegrationTest,SecurityRouteOwnershipRegistryTest,SingleSecurityFilterChainGuardTest,AlertServiceMetricsTest" test

      - name: Verify security route boundary backend reports
        run: node scripts/ci/verify-junit-reports.mjs --suite securityRouteBoundary

      - name: Run security route grep guardrails
        run: |
          if grep -R "anyRequest()\.permitAll()" alert-service/src/main/java/com/frauddetection/alert/security/config; then
            echo "Security route boundary forbids anyRequest().permitAll() in alert-service security config" >&2
            exit 1
          fi
          if grep -R 'requestMatchers("/api/\*\*")\.permitAll()' alert-service/src/main/java/com/frauddetection/alert/security/config; then exit 1; fi
          if grep -R 'requestMatchers("/api/v1/\*\*")\.permitAll()' alert-service/src/main/java/com/frauddetection/alert/security/config; then exit 1; fi
          if grep -R 'requestMatchers("/governance/\*\*")\.permitAll()' alert-service/src/main/java/com/frauddetection/alert/security/config; then exit 1; fi
          if grep -R 'requestMatchers("/system/\*\*")\.permitAll()' alert-service/src/main/java/com/frauddetection/alert/security/config; then exit 1; fi
          if grep -R 'requestMatchers("/bff/\*\*")\.permitAll()' alert-service/src/main/java/com/frauddetection/alert/security/config; then exit 1; fi
          if grep -R "HttpMethod\.POST\|HttpMethod\.PUT\|HttpMethod\.PATCH\|HttpMethod\.DELETE" alert-service/src/main/java/com/frauddetection/alert/security/config/SpaFallbackAuthorizationRules.java; then
            echo "Security route boundary requires the SPA fallback to remain GET-only" >&2
            exit 1
          fi

      - name: Install frontend dependencies securely
        working-directory: analyst-console-ui
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          npm ci --ignore-scripts

      - name: Run frontend API client boundary tests
        working-directory: analyst-console-ui
        run: npm test -- --run src/api/apiClientBoundary.test.js src/auth/authProvider.test.js src/api/alertsApi.test.js src/workspace/workspaceDataHooks.test.js src/fraudCases/useFraudCaseWorkQueue.test.js src/fraudCases/useFraudCaseWorkQueueSummary.test.js --reporter=default --reporter=junit --outputFile=./test-results/security-route-boundary-vitest.xml

      - name: Guard auth-sensitive API boundary
        working-directory: analyst-console-ui
        run: |
          npm run check:auth-sensitive-api-boundary
          echo "auth_sensitive_api_boundary_guard_ran=true" > test-results/auth-sensitive-api-boundary-guard.txt

      - name: Verify security route boundary frontend report
        run: node scripts/ci/verify-vitest-reports.mjs --suite securityRouteBoundary

      - name: Build security route boundary UI
        working-directory: analyst-console-ui
        run: npm run build

      - name: Upload security route boundary reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-route-boundary-reports
          if-no-files-found: ignore
          path: |
            alert-service/target/surefire-reports/
            analyst-console-ui/test-results/security-route-boundary-vitest.xml
            analyst-console-ui/test-results/auth-sensitive-api-boundary-guard.txt

