name: Docker Compose CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compose-config:
    name: Compose config / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            files: -f deployment/docker-compose.yml
          - name: dev
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml
          - name: ai-opt-in
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.ai.yml
          - name: oidc
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.oidc.yml
          - name: jwt-service-identity
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.service-identity-jwt.yml
          - name: rs256-service-identity
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.service-identity-rs256.yml
          - name: mtls-service-identity
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.service-identity-mtls.yml
          - name: hardened
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.hardened.yml
          - name: full-local-security-hardened
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.oidc.yml -f deployment/docker-compose.service-identity-mtls.yml -f deployment/docker-compose.trust-authority-jwt.yml -f deployment/docker-compose.hardened.yml -f deployment/docker-compose.model-promotion-policy-trust.yml
          - name: generated-shadow-performance-local
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.oidc.yml -f deployment/docker-compose.service-identity-mtls.yml -f deployment/docker-compose.trust-authority-jwt.yml -f deployment/docker-compose.hardened.yml -f deployment/docker-compose.model-promotion-policy-trust.yml -f deployment/docker-compose.shadow-performance-generated.yml
          - name: exact-model-shadow-performance-reader
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.model-shadow-performance-generated.yml
          - name: exact-model-shadow-performance-hardened
            files: -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.oidc.yml -f deployment/docker-compose.service-identity-mtls.yml -f deployment/docker-compose.trust-authority-jwt.yml -f deployment/docker-compose.hardened.yml -f deployment/docker-compose.model-promotion-policy-trust.yml -f deployment/docker-compose.shadow-performance-generated.yml -f deployment/docker-compose.model-shadow-performance-generated.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify all base and runtime image references are pinned and scanned
        run: node scripts/security/run-security-gate.mjs image-inventory

      - name: Generate local identity fixtures for Compose overlays
        run: |
          bash scripts/bootstrap-local-fixtures.sh
          node scripts/bootstrap-local-model-promotion-keys.mjs --ensure
          node scripts/bootstrap-local-audit-trust-key.mjs --ensure

      - name: Validate supported Compose combination
        run: docker compose --env-file deployment/.env.example ${{ matrix.files }} config --quiet

  resolved-security-config:
    name: Resolved Compose Security Assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate local runtime fixture from example
        run: |
          test -f deployment/.env.example
          cp deployment/.env.example deployment/.env
          test -f deployment/.env

      - name: Assert base does not publish host ports
        run: docker compose --env-file deployment/.env.example -f deployment/docker-compose.yml config --format json | node scripts/check-compose-security-config.mjs base

      - name: Assert default dev excludes AI and is localhost-only
        run: docker compose --env-file deployment/.env.example -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml config --format json | node scripts/check-compose-security-config.mjs dev

      - name: Assert opt-in AI config
        run: docker compose --env-file deployment/.env.example -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.ai.yml config --format json | node scripts/check-compose-security-config.mjs ai

      - name: Generate local identity fixtures for security overlays
        run: |
          bash scripts/bootstrap-local-fixtures.sh
          node scripts/bootstrap-local-model-promotion-keys.mjs --ensure
          node scripts/bootstrap-local-audit-trust-key.mjs --ensure

      - name: Assert recommended local security demonstration and app hardening
        run: docker compose --env-file deployment/.env.example -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.oidc.yml -f deployment/docker-compose.service-identity-mtls.yml -f deployment/docker-compose.trust-authority-jwt.yml -f deployment/docker-compose.hardened.yml -f deployment/docker-compose.model-promotion-policy-trust.yml config --format json | node scripts/check-compose-security-config.mjs security-hardened

      - name: Assert exact-model evidence mount declaration is read-only and explicit
        run: >-
          node scripts/check-compose-security-config.mjs model-shadow-performance-source
          --source-file deployment/docker-compose.model-shadow-performance-generated.yml

      - name: Assert resolved exact-model evidence reader boundary
        run: docker compose --env-file deployment/.env.example -f deployment/docker-compose.yml -f deployment/docker-compose.model-shadow-performance-generated.yml config --no-env-resolution --format json | node scripts/check-compose-security-config.mjs model-shadow-performance

      - name: Assert hardened stack preserves the exact-model reader boundary
        run: docker compose --env-file deployment/.env.example -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml -f deployment/docker-compose.oidc.yml -f deployment/docker-compose.service-identity-mtls.yml -f deployment/docker-compose.trust-authority-jwt.yml -f deployment/docker-compose.hardened.yml -f deployment/docker-compose.model-promotion-policy-trust.yml -f deployment/docker-compose.shadow-performance-generated.yml -f deployment/docker-compose.model-shadow-performance-generated.yml config --no-env-resolution --format json | node scripts/check-compose-security-config.mjs security-hardened-model-shadow-performance

      - name: Verify resolved exact-model source and reader ACL
        run: make exact-model-shadow-preflight

      - name: Test Compose security assertion mutations
        run: node --test scripts/check-compose-security-config.test.mjs

      - name: Test read-only audit index preflight
        run: node --test scripts/audit-chain-index-preflight.test.mjs

      - name: Test local policy signing-key bootstrap fail-closed behavior
        run: node --test scripts/bootstrap-local-model-promotion-keys.test.mjs

      - name: Test local audit-trust key bootstrap fail-closed behavior
        run: node --test scripts/bootstrap-local-audit-trust-key.test.mjs

      - name: Test local startup contract
        run: node --test scripts/local-startup-contract.test.mjs

      - name: Test model-promotion trust administration
        run: node --test scripts/model-promotion-trust-admin.test.mjs

      - name: Verify artifact preflight and Docker read-only behavior
        run: node scripts/security/run-security-gate.mjs compose-bind-mount-check

  exact-model-runtime-boundary:
    name: Exact Model / non-root artifact reader
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify publisher, reader ACL, and HTTP boundary
        run: node scripts/security/run-security-gate.mjs exact-model-runtime-boundary

  runtime-smoke:
    name: Runtime Smoke / default dev without AI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the shared Kafka image before Compose runtime smoke
        uses: ./.github/actions/load-kafka-test-image

      - name: Generate local runtime fixture from example
        run: |
          test -f deployment/.env.example
          cp deployment/.env.example deployment/.env
          test -f deployment/.env

      - name: Assert default dev services exclude AI
        run: |
          services="$(docker compose --env-file deployment/.env -f deployment/docker-compose.yml -f deployment/docker-compose.dev.yml config --services)"
          printf '%s\n' "$services"
          if printf '%s\n' "$services" | grep -Fxq -e ollama -e ollama-model-init; then
            echo "Default dev services unexpectedly include AI." >&2
            exit 1
          fi

      - name: Start services and verify health endpoints
        run: bash scripts/ci/compose-runtime-smoke.sh dev

  app-hardening-runtime-smoke:
    name: Runtime Smoke / app hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the shared Kafka image before Compose runtime smoke
        uses: ./.github/actions/load-kafka-test-image

      - name: Generate local runtime fixture from example
        run: |
          test -f deployment/.env.example
          cp deployment/.env.example deployment/.env
          test -f deployment/.env

      - name: Start services and verify read-only application runtime
        run: bash scripts/ci/compose-runtime-smoke.sh app-hardening

  full-security-runtime-smoke:
    name: Runtime Smoke / full security hardened
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the shared Kafka image before Compose runtime smoke
        uses: ./.github/actions/load-kafka-test-image

      - name: Generate local runtime fixture from example
        run: |
          test -f deployment/.env.example
          cp deployment/.env.example deployment/.env
          test -f deployment/.env

      - name: Generate local identity fixtures
        run: |
          bash scripts/bootstrap-local-fixtures.sh
          node scripts/bootstrap-local-model-promotion-keys.mjs --ensure
          node scripts/bootstrap-local-audit-trust-key.mjs --ensure

      - name: Start official complete local security demonstration stack
        run: bash scripts/ci/compose-runtime-smoke.sh full-security-hardened

  demo-fixture-guard-tests:
    name: Demo Fixture Guard Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load central security policy
        id: security-policy
        run: node scripts/security/run-security-gate.mjs policy --github-output "$GITHUB_OUTPUT"

      - name: Generate local identity fixtures for fixture guard tests
        run: bash scripts/bootstrap-local-fixtures.sh

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java

      - name: Test alert-service fixture guards
        run: mvn -B -pl alert-service -am -Dsurefire.failIfNoSpecifiedTests=false -Dtest=InternalServiceClientProdGuardTest,AuditTrustAuthorityClientConfigurationTest test

      - name: Test fraud-scoring-service fixture guard
        run: mvn -B -pl fraud-scoring-service -am -Dsurefire.failIfNoSpecifiedTests=false -Dtest=InternalServiceClientProdGuardTest test

      - name: Test audit-trust-authority fixture guard
        run: mvn -B -pl audit-trust-authority -am -Dsurefire.failIfNoSpecifiedTests=false -Dtest=TrustAuthorityServiceTest test

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.security-policy.outputs.python_version }}
          pip-version: ${{ steps.security-policy.outputs.pip_version }}
          cache: pip
          cache-dependency-path: ml-inference-service/requirements.txt

      - name: Install ML test dependencies
        working-directory: ml-inference-service
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Test ML fixture guard
        working-directory: ml-inference-service
        run: python -m unittest discover -s tests

  repository-secret-gate:
    name: Repository Secret Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load central security policy
        id: security-policy
        run: node scripts/security/run-security-gate.mjs policy --github-output "$GITHUB_OUTPUT"

      - name: Reject committed private key material
        run: node scripts/security/run-security-gate.mjs committed-private-key-check
      - name: Block repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PARALLEL: '1'
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: fs
          scan-ref: .
          version: ${{ steps.security-policy.outputs.trivy_version }}
          cache: false
          scanners: secret
          format: table
          timeout: ${{ steps.security-policy.outputs.secret_scan_timeout }}
          exit-code: '1'

      - name: Prove secret-only scan works while Maven resolution is unavailable
        env:
          SECRET_PROOF_EVIDENCE_PATH: target/security/secret-proof-summary.json
        run: node scripts/security/run-security-gate.mjs secret-proof

      - name: Upload safe secret proof summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-secret-proof-${{ github.sha }}
          path: target/security/secret-proof-summary.json
          if-no-files-found: ignore
          retention-days: ${{ steps.security-policy.outputs.artifact_retention_days }}

  repository-configuration-gate:
    name: Docker and Compose Misconfiguration Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load central security policy
        id: security-policy
        run: node scripts/security/run-security-gate.mjs policy --github-output "$GITHUB_OUTPUT"

      - name: Block high or critical Docker and Compose misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PARALLEL: '1'
        with:
          scan-type: config
          scan-ref: .
          version: ${{ steps.security-policy.outputs.trivy_version }}
          cache: false
          scanners: misconfig
          format: json
          output: trivy-config.json
          severity: ${{ steps.security-policy.outputs.blocking_vulnerability_severities }}
          timeout: ${{ steps.security-policy.outputs.repository_scan_timeout }}
          exit-code: '1'

      - name: Upload Docker and Compose misconfiguration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-config-scan-${{ github.sha }}
          path: trivy-config.json
          if-no-files-found: error
          retention-days: ${{ steps.security-policy.outputs.artifact_retention_days }}

  repository-vulnerability-gate:
    name: Repository High/Critical Vulnerability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load central security policy
        id: security-policy
        run: node scripts/security/run-security-gate.mjs policy --github-output "$GITHUB_OUTPUT"

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java

      - name: Resolve Maven dependencies and build plugins for Trivy
        run: node scripts/security/run-security-gate.mjs maven-prefetch

      - name: Prepare vulnerability evidence directory
        run: mkdir -p target/security/trivy

      - name: Scan repository dependencies once
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PARALLEL: '1'
          TRIVY_OFFLINE_SCAN: 'true'
          HOME: ${{ github.workspace }}/target/security/home
        with:
          scan-type: fs
          scan-ref: .
          version: ${{ steps.security-policy.outputs.trivy_version }}
          cache: false
          vuln-type: os,library
          scanners: vuln
          skip-dirs: target/security/home/.m2/repository
          skip-files: '**/pom.xml,**/*.pom'
          format: json
          output: target/security/trivy/repository.json
          severity: ${{ steps.security-policy.outputs.all_vulnerability_severities }}
          list-all-pkgs: 'true'
          timeout: ${{ steps.security-policy.outputs.repository_scan_timeout }}
          exit-code: '0'

      - name: Scan the isolated Maven repository as a root filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PARALLEL: '1'
          TRIVY_OFFLINE_SCAN: 'true'
          HOME: ${{ github.workspace }}/target/security/home
        with:
          scan-type: rootfs
          scan-ref: target/security/home/.m2/repository
          version: ${{ steps.security-policy.outputs.trivy_version }}
          cache: false
          vuln-type: library
          scanners: vuln
          list-all-pkgs: 'true'
          format: json
          output: target/security/trivy/resolved-maven.json
          severity: ${{ steps.security-policy.outputs.all_vulnerability_severities }}
          list-all-pkgs: 'true'
          timeout: ${{ steps.security-policy.outputs.repository_scan_timeout }}
          exit-code: '0'

      - name: Evaluate one complete vulnerability report and blocking policy
        if: always()
        run: >-
          node scripts/security/run-security-gate.mjs vulnerability-evidence
          --repository target/security/trivy/repository.json
          --maven target/security/trivy/resolved-maven.json
          --output target/security/trivy/combined.json
          --summary target/security/trivy/summary.json

      - name: Derive SARIF from the combined Trivy JSON report
        if: always() && hashFiles('target/security/trivy/combined.json') != ''
        run: trivy convert --format sarif --severity "${{ steps.security-policy.outputs.all_vulnerability_severities }}" --output target/security/trivy/vulnerability.sarif target/security/trivy/combined.json

      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('target/security/trivy/vulnerability.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: target/security/trivy/vulnerability.sarif

      - name: Upload combined vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-vulnerability-evidence-${{ github.sha }}
          path: |
            target/security/trivy/combined.json
            target/security/trivy/summary.json
            target/security/trivy/repository.json
            target/security/trivy/resolved-maven.json
            target/security/trivy/vulnerability.sarif
          if-no-files-found: error
          retention-days: ${{ steps.security-policy.outputs.artifact_retention_days }}

  image-inventory:
    name: Validate image inventory
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.inventory.outputs.backend }}
      services: ${{ steps.inventory.outputs.services }}
      infrastructure: ${{ steps.inventory.outputs.infrastructure }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate image coverage and publish matrix inputs
        id: inventory
        run: node scripts/security/run-security-gate.mjs image-inventory --write-inventory target/image-security/expected-inventory.json --write-github-matrices

  maven-backend-dependency-cache:
    name: Resolve and cache backend Maven dependencies once
    needs: image-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: |
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Resolve the reactor once and export its verified Maven layer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/Dockerfile.backend
          target: maven-dependencies
          push: false
          pull: true
          cache-from: type=gha,scope=maven-backend-dependencies
          cache-to: type=gha,scope=maven-backend-dependencies,mode=max

  backend-images:
    name: Backend image / ${{ matrix.image.logicalName }}
    needs: [image-inventory, maven-backend-dependency-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: ${{ fromJSON(needs.image-inventory.outputs.backend) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: |
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Build and scan backend image
        uses: ./.github/actions/build-and-scan-image
        with:
          source: ${{ matrix.image.source }}
          image-ref: ${{ matrix.image.imageRef || format('{0}:{1}', matrix.image.repository, github.sha) }}
          dockerfile: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.buildArgs }}
          target: ${{ matrix.image.target }}
          cache-scope: ${{ matrix.image.artifactName }}
          cache-from-scopes: |
            type=gha,scope=maven-backend-dependencies
            type=gha,scope=${{ matrix.image.artifactName }}
          artifact-name: ${{ matrix.image.artifactName }}

  service-images:
    name: Service image / ${{ matrix.image.logicalName }}
    needs: image-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.image-inventory.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: |
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Build and scan service image
        uses: ./.github/actions/build-and-scan-image
        with:
          source: ${{ matrix.image.source }}
          image-ref: ${{ matrix.image.imageRef || format('{0}:{1}', matrix.image.repository, github.sha) }}
          dockerfile: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.buildArgs }}
          target: ${{ matrix.image.target }}
          cache-scope: ${{ matrix.image.artifactName }}
          artifact-name: ${{ matrix.image.artifactName }}

  infrastructure-images:
    name: Infrastructure image / ${{ matrix.image.logicalName }}
    needs: image-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.image-inventory.outputs.infrastructure) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        if: matrix.image.logicalName != 'apache-kafka-runtime'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: |
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Build and scan infrastructure image
        if: matrix.image.logicalName != 'apache-kafka-runtime'
        uses: ./.github/actions/build-and-scan-image
        with:
          source: ${{ matrix.image.source }}
          image-ref: ${{ matrix.image.imageRef || format('{0}:{1}', matrix.image.repository, github.sha) }}
          dockerfile: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.buildArgs }}
          target: ${{ matrix.image.target }}
          cache-scope: ${{ matrix.image.artifactName }}
          artifact-name: ${{ matrix.image.artifactName }}

      - name: Load the shared Kafka OCI artifact
        if: matrix.image.logicalName == 'apache-kafka-runtime'
        uses: ./.github/actions/load-kafka-test-image

      - name: Scan the shared Kafka OCI artifact
        if: matrix.image.logicalName == 'apache-kafka-runtime'
        uses: ./.github/actions/scan-built-image
        with:
          image-ref: ${{ matrix.image.imageRef }}
          build-metadata-path: target/kafka-shared-image/buildx-metadata.json
          build-digest-path: target/kafka-shared-image/buildx-digest.txt
          oci-archive-path: target/kafka-shared-image/image.oci.tar
          artifact-name: ${{ matrix.image.artifactName }}
          output-directory: target/image-security/downloads/${{ matrix.image.artifactName }}-${{ github.sha }}

  image-scan-evidence:
    name: Aggregate image scan and SBOM evidence
    if: ${{ always() }}
    needs: [image-inventory, backend-images, service-images, infrastructure-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTED_GIT_SHA: ${{ github.sha }}
      IMAGE_SCAN_JOB_RESULTS: '{"backend-images":"${{ needs.backend-images.result }}","service-images":"${{ needs.service-images.result }}","infrastructure-images":"${{ needs.infrastructure-images.result }}"}'
    steps:
      - name: Checkout
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recreate expected image inventory
        if: ${{ always() }}
        run: node scripts/security/run-security-gate.mjs image-inventory --write-inventory target/image-security/expected-inventory.json
      - name: Download backend image evidence
        if: ${{ always() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'backend-image-*-security-${{ github.sha }}'
          path: target/image-security/downloads
          merge-multiple: false
      - name: Download service image evidence
        if: ${{ always() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'service-image-*-security-${{ github.sha }}'
          path: target/image-security/downloads
          merge-multiple: false
      - name: Download infrastructure image evidence
        if: ${{ always() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'external-image-*-security-${{ github.sha }}'
          path: target/image-security/downloads
          merge-multiple: false
      - name: Exercise image inventory and evidence rejection cases
        if: ${{ always() }}
        run: node --test scripts/security/evidence/check-image-scan-coverage.test.mjs scripts/security/evidence/validate-image-scan-evidence.test.mjs scripts/security/evidence/verify-buildx-image-metadata.test.mjs
      - name: Validate complete image scans and SBOMs
        if: ${{ always() }}
        run: node scripts/security/run-security-gate.mjs image-evidence target/image-security/expected-inventory.json target/image-security/downloads
      - name: Upload image scan evidence validation summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-validation-${{ github.sha }}
          path: target/image-security/validated-image-scan-summary.json
          if-no-files-found: ignore
          retention-days: ${{ steps.security-policy.outputs.artifact_retention_days }}
