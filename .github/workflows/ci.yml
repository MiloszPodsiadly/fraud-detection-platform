          echo "api_client_scope_guard_ran=true" >> test-results/frontend-architecture-guards.txt
          echo "::endgroup::"
          echo "::group::Workspace runtime scope guard"
          npm run check:scope:workspace-runtime
          echo "workspace_runtime_scope_guard_ran=true" >> test-results/frontend-architecture-guards.txt
          echo "::endgroup::"
