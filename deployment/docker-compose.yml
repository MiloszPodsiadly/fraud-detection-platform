x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks:
    - backend

x-observability-hardening: &observability-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m

x-java-healthcheck: &java-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 45s

services:
  kafka:
    <<: *service-defaults
    image: fdp-local/kafka:4.4.0-temurin-25.0.5.1_2-r3
    pull_policy: build
    build:
      context: ..
      dockerfile: deployment/Dockerfile.kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # Fresh KRaft storage; it does not import the previous 4.3.1 container-layer logs.
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-topics-init:
    image: fdp-local/kafka:4.4.0-temurin-25.0.5.1_2-r3
    pull_policy: never
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init-kafka-topics.sh:/opt/init/init-kafka-topics.sh:ro
    environment:
      BOOTSTRAP_SERVER: kafka:9092
    restart: "no"
    command:
      - /bin/bash
      - /opt/init/init-kafka-topics.sh
    logging: *default-logging
    networks:
      - backend

  # Local single-member replica set so transaction-dependent workflows can be evaluated locally.
  # This topology is not a production availability or recovery design.
  mongodb:
    <<: *service-defaults
    image: mongo:7.0.48@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
    entrypoint: ["/bin/bash", "/opt/mongodb-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?Set MONGODB_ROOT_USERNAME in deployment/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set MONGODB_ROOT_PASSWORD in deployment/.env}
      MONGO_INITDB_DATABASE: admin
      MONGODB_GOVERNANCE_PASSWORD: ${MONGODB_GOVERNANCE_PASSWORD:?Set MONGODB_GOVERNANCE_PASSWORD in deployment/.env}
      MONGODB_TRUST_AUTHORITY_PASSWORD: ${MONGODB_TRUST_AUTHORITY_PASSWORD:?Set MONGODB_TRUST_AUTHORITY_PASSWORD in deployment/.env}
      MONGODB_ALERTS_PASSWORD: ${MONGODB_ALERTS_PASSWORD:?Set MONGODB_ALERTS_PASSWORD in deployment/.env}
      MONGODB_POLICY_PUBLISHER_PASSWORD: ${MONGODB_POLICY_PUBLISHER_PASSWORD:?Set MONGODB_POLICY_PUBLISHER_PASSWORD in deployment/.env}
    volumes:
      - mongodb-data:/data/db
      - ./mongodb-entrypoint.sh:/opt/mongodb-entrypoint.sh:ro
      - ./mongo-init-users.js:/docker-entrypoint-initdb.d/10-create-app-users.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"const admin=db.getSiblingDB('admin'); const replicaSet='rs0'; let hello=admin.runCommand({hello:1}); if(!hello.ok) quit(1); if(hello.setName && hello.setName!==replicaSet) quit(1); if(!hello.setName){const initiated=admin.runCommand({replSetInitiate:{_id:replicaSet,members:[{_id:0,host:'mongodb:27017'}]}}); if(!initiated.ok && initiated.codeName!=='AlreadyInitialized') quit(1)}; const deadline=Date.now()+8000; while(Date.now()<deadline){hello=admin.runCommand({hello:1}); if(hello.ok && hello.setName===replicaSet && hello.isWritablePrimary) quit(0); sleep(200)}; quit(1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Run once against a currently-running pre-auth local Mongo volume before recreating mongodb with auth enabled.
  mongodb-auth-migrate:
    profiles: [mongodb-auth-migrate]
    image: mongo:7.0.48@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
    restart: "no"
    command: ["mongosh", "--host", "mongodb", "--quiet", "--file", "/docker-entrypoint-initdb.d/10-create-app-users.js"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?Set MONGODB_ROOT_USERNAME in deployment/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set MONGODB_ROOT_PASSWORD in deployment/.env}
      MONGODB_GOVERNANCE_PASSWORD: ${MONGODB_GOVERNANCE_PASSWORD:?Set MONGODB_GOVERNANCE_PASSWORD in deployment/.env}
      MONGODB_TRUST_AUTHORITY_PASSWORD: ${MONGODB_TRUST_AUTHORITY_PASSWORD:?Set MONGODB_TRUST_AUTHORITY_PASSWORD in deployment/.env}
      MONGODB_ALERTS_PASSWORD: ${MONGODB_ALERTS_PASSWORD:?Set MONGODB_ALERTS_PASSWORD in deployment/.env}
      MONGODB_POLICY_PUBLISHER_PASSWORD: ${MONGODB_POLICY_PUBLISHER_PASSWORD:?Set MONGODB_POLICY_PUBLISHER_PASSWORD in deployment/.env}
      MONGODB_AUTH_MIGRATION: "true"
    volumes:
      - ./mongo-init-users.js:/docker-entrypoint-initdb.d/10-create-app-users.js:ro
    networks:
      - backend

  # Standalone local Redis. Redis Cluster is unsupported by the model-promotion quota Lua script.
  redis:
    <<: *service-defaults
    image: redis:8.12.0-alpine@sha256:ff55e25203f915f2fe9cc1428e6da969fec257dd6e6feb71a34fd0cf3a86b289
    command: ["/bin/sh", "/opt/redis-entrypoint.sh"]
    environment:
      REDIS_FEATURE_ENRICHER_PASSWORD: ${REDIS_FEATURE_ENRICHER_PASSWORD:?Set REDIS_FEATURE_ENRICHER_PASSWORD in deployment/.env}
      REDIS_ALERT_PASSWORD: ${REDIS_ALERT_PASSWORD:?Set REDIS_ALERT_PASSWORD in deployment/.env}
    volumes:
      - redis-data:/data
      - ./redis-entrypoint.sh:/opt/redis-entrypoint.sh:ro
      - ./redis-acl-users.sh:/opt/redis-acl-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_ALERT_PASSWORD}\" redis-cli --user alert-service ping | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  ml-inference-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ml-inference
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://governance_app:${MONGODB_GOVERNANCE_PASSWORD:?Set MONGODB_GOVERNANCE_PASSWORD in deployment/.env}@mongodb:27017/fraud_governance?authSource=fraud_governance&replicaSet=rs0
      GOVERNANCE_SNAPSHOT_COLLECTION: ml_governance_snapshots
      GOVERNANCE_SNAPSHOT_RETENTION_LIMIT: "500"
      GOVERNANCE_SNAPSHOT_INTERVAL_REQUESTS: "50"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  audit-trust-authority:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        MODULE_NAME: audit-trust-authority
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker,docker-local
      TRUST_AUTHORITY_NAME: ${TRUST_AUTHORITY_NAME:-local-trust-authority}
      TRUST_AUTHORITY_ACTIVE_KEY_ID: ${TRUST_AUTHORITY_ACTIVE_KEY_ID:-local-ed25519-key-1}
      MONGODB_URI: mongodb://trust_authority_app:${MONGODB_TRUST_AUTHORITY_PASSWORD:?Set MONGODB_TRUST_AUTHORITY_PASSWORD in deployment/.env}@mongodb:27017/fraud_trust_authority?authSource=fraud_trust_authority&replicaSet=rs0&serverSelectionTimeoutMS=5000&connectTimeoutMS=3000&socketTimeoutMS=5000
      SPRING_MONGODB_URI: mongodb://trust_authority_app:${MONGODB_TRUST_AUTHORITY_PASSWORD:?Set MONGODB_TRUST_AUTHORITY_PASSWORD in deployment/.env}@mongodb:27017/fraud_trust_authority?authSource=fraud_trust_authority&replicaSet=rs0&serverSelectionTimeoutMS=5000&connectTimeoutMS=3000&socketTimeoutMS=5000
      TRUST_AUTHORITY_ACTIVE_PRIVATE_KEY_PATH: /tmp/audit-trust-authority/ed25519-private.key
      TRUST_AUTHORITY_ACTIVE_PUBLIC_KEY_PATH: /tmp/audit-trust-authority/ed25519-public.key
      TRUST_AUTHORITY_AUDIT_PATH: /tmp/audit-trust-authority/trust-authority-audit.jsonl
    healthcheck: *java-healthcheck

  # Activated by the JWT trust overlay; copies protected local keys for uid 10001.
  audit-trust-key-loader:
    profiles:
      - audit-trust-loader
    image: eclipse-temurin:21.0.13.1_2-jre-noble@sha256:897ec01ae1350622de0d5393a48a4ffffee8fe1609f248f4389578b919eaf9f5
    restart: "no"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for file in ed25519-private.key ed25519-public.key; do
          source="/run/audit-trust-source/$${file}"
          test -f "$${source}" && test ! -L "$${source}" && test -s "$${source}"
          temporary="$$(mktemp /run/audit-trust-keys/.key.XXXXXX)"
          cp "$${source}" "$${temporary}"
          chown 10001:10001 "$${temporary}"
          chmod 0400 "$${temporary}"
          mv -f "$${temporary}" "/run/audit-trust-keys/$${file}"
        done
        chown 10001:10001 /run/audit-trust-keys
        chmod 0500 /run/audit-trust-keys
    volumes:
      - type: bind
        source: ./.local/audit-trust-authority
        target: /run/audit-trust-source
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: audit-trust-keys
        target: /run/audit-trust-keys

  prometheus:
    <<: [*service-defaults, *observability-hardening]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus

  grafana:
    <<: [*service-defaults, *observability-hardening]
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  transaction-ingest-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        MODULE_NAME: transaction-ingest-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck: *java-healthcheck

  transaction-simulator-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        MODULE_NAME: transaction-simulator-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../data/generated:/app/data/generated
    healthcheck: *java-healthcheck

  feature-enricher-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        MODULE_NAME: feature-enricher-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: feature-enricher
      REDIS_PASSWORD: ${REDIS_FEATURE_ENRICHER_PASSWORD:?Set REDIS_FEATURE_ENRICHER_PASSWORD in deployment/.env}
    healthcheck: *java-healthcheck

  fraud-scoring-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        MODULE_NAME: fraud-scoring-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-inference-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_MODEL_BASE_URL: http://ml-inference-service:8090
      SCORING_MODE: SHADOW
    healthcheck: *java-healthcheck

  alert-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        MODULE_NAME: alert-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      audit-trust-authority:
        condition: service_healthy
      ml-inference-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_PREDICTION_EVIDENCE_REDRIVE_ENABLED: ${ML_PREDICTION_EVIDENCE_REDRIVE_ENABLED:-false}
      ENGINE_INTELLIGENCE_REDRIVE_ENABLED: ${ENGINE_INTELLIGENCE_REDRIVE_ENABLED:-false}
      MONGODB_URI: mongodb://alert_app:${MONGODB_ALERTS_PASSWORD:?Set MONGODB_ALERTS_PASSWORD in deployment/.env}@mongodb:27017/fraud_alerts?authSource=fraud_alerts&replicaSet=rs0&serverSelectionTimeoutMS=5000&connectTimeoutMS=3000&socketTimeoutMS=5000
      SPRING_MONGODB_URI: mongodb://alert_app:${MONGODB_ALERTS_PASSWORD:?Set MONGODB_ALERTS_PASSWORD in deployment/.env}@mongodb:27017/fraud_alerts?authSource=fraud_alerts&replicaSet=rs0&serverSelectionTimeoutMS=5000&connectTimeoutMS=3000&socketTimeoutMS=5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: alert-service
      REDIS_PASSWORD: ${REDIS_ALERT_PASSWORD:?Set REDIS_ALERT_PASSWORD in deployment/.env}
      # Plain "docker" profile requires Redis; in-memory needs an allowlisted single-node profile and bank fail-closed=false.
      MODEL_PROMOTION_API_RATE_LIMITER_MODE: ${MODEL_PROMOTION_API_RATE_LIMITER_MODE:-redis}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_RECOVERY_ENABLED: ${OUTBOX_RECOVERY_ENABLED:-true}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-PT1M}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_STALE_THRESHOLD: ${OUTBOX_STALE_THRESHOLD:-PT10M}
      OUTBOX_PUBLISHER_DELAY_MS: ${OUTBOX_PUBLISHER_DELAY_MS:-5000}
      OUTBOX_RECOVERY_STALE_PROCESSING_THRESHOLD: ${OUTBOX_RECOVERY_STALE_PROCESSING_THRESHOLD:-PT2M}
      ML_GOVERNANCE_BASE_URL: http://ml-inference-service:8090
      AUDIT_EXTERNAL_ANCHORING_PUBLICATION_ENABLED: ${AUDIT_EXTERNAL_ANCHORING_PUBLICATION_ENABLED:-false}
      AUDIT_EXTERNAL_ANCHORING_PUBLICATION_REQUIRED: ${AUDIT_EXTERNAL_ANCHORING_PUBLICATION_REQUIRED:-false}
      AUDIT_EXTERNAL_ANCHORING_PUBLICATION_FAIL_CLOSED: ${AUDIT_EXTERNAL_ANCHORING_PUBLICATION_FAIL_CLOSED:-false}
      AUDIT_EXTERNAL_ANCHORING_SINK: ${AUDIT_EXTERNAL_ANCHORING_SINK:-local-file}
      AUDIT_EXTERNAL_ANCHORING_LOCAL_FILE_PATH: ${AUDIT_EXTERNAL_ANCHORING_LOCAL_FILE_PATH:-/tmp/audit-external-anchors.jsonl}
      AUDIT_EXTERNAL_ANCHORING_OBJECT_STORE_STARTUP_CHECK_ENABLED: ${AUDIT_EXTERNAL_ANCHORING_OBJECT_STORE_STARTUP_CHECK_ENABLED:-true}
      AUDIT_EXTERNAL_ANCHORING_INITIAL_DELAY_MS: ${AUDIT_EXTERNAL_ANCHORING_INITIAL_DELAY_MS:-5000}
      AUDIT_EXTERNAL_ANCHORING_PUBLISH_DELAY_MS: ${AUDIT_EXTERNAL_ANCHORING_PUBLISH_DELAY_MS:-10000}
      AUDIT_TRUST_AUTHORITY_ENABLED: ${AUDIT_TRUST_AUTHORITY_ENABLED:-false}
      AUDIT_TRUST_AUTHORITY_URL: http://audit-trust-authority:8080
      AUDIT_TRUST_AUTHORITY_SIGNING_REQUIRED: ${AUDIT_TRUST_AUTHORITY_SIGNING_REQUIRED:-false}
      AUDIT_TRUST_AUTHORITY_CALLER_SERVICE_NAME: alert-service
      AUDIT_TRUST_AUTHORITY_CALLER_ENVIRONMENT: ${AUDIT_TRUST_AUTHORITY_CALLER_ENVIRONMENT:-docker-local}
      SHADOW_PERFORMANCE_SUMMARY_CURRENT_ENABLED: ${SHADOW_PERFORMANCE_SUMMARY_CURRENT_ENABLED:-false}
      SHADOW_PERFORMANCE_SUMMARY_CURRENT_BASE_DIR: ${SHADOW_PERFORMANCE_SUMMARY_CURRENT_BASE_DIR:-/run/shadow-performance}
      SHADOW_PERFORMANCE_SUMMARY_CURRENT_PATH: ${SHADOW_PERFORMANCE_SUMMARY_CURRENT_PATH:-}
      SHADOW_PERFORMANCE_SUMMARY_CURRENT_MAX_SIZE_BYTES: ${SHADOW_PERFORMANCE_SUMMARY_CURRENT_MAX_SIZE_BYTES:-1048576}
      MODEL_CARD_CURRENT_ENABLED: ${MODEL_CARD_CURRENT_ENABLED:-false}
      MODEL_CARD_CURRENT_BASE_DIR: ${MODEL_CARD_CURRENT_BASE_DIR:-/run/model-card}
      MODEL_CARD_CURRENT_PATH: ${MODEL_CARD_CURRENT_PATH:-}
      MODEL_CARD_CURRENT_MAX_CARD_SIZE_BYTES: ${MODEL_CARD_CURRENT_MAX_CARD_SIZE_BYTES:-524288}
      MODEL_CARD_CURRENT_MAX_MARKDOWN_SIZE_BYTES: ${MODEL_CARD_CURRENT_MAX_MARKDOWN_SIZE_BYTES:-262144}
      ASSISTANT_MODE: ${ASSISTANT_MODE:-DETERMINISTIC}
    healthcheck: *java-healthcheck

  # Complete but inactive without the policy-trust overlay; hardening may safely reference it.
  model-promotion-policy-publisher:
    <<: *service-defaults
    profiles:
      - policy-trust
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      args:
        MODULE_NAME: model-promotion-policy-publisher
    user: "10001:10001"
    command:
      - /usr/local/bin/exec-with-verified-temurin-java
      - -jar
      - /app/app.jar
      - worker
    depends_on:
      mongodb:
        condition: service_healthy

  analyst-console-ui:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    depends_on:
      alert-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
      - edge

networks:
  backend:
  edge:

volumes:
  audit-trust-keys:
  kafka-data:
  mongodb-data:
  redis-data:
  prometheus-data:
  grafana-data:
