x-ollama-hardening: &ollama-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  ollama:
    image: ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    restart: unless-stopped
    <<: *ollama-hardening
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  ollama-model-init:
    image: ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    <<: *ollama-hardening
    depends_on:
      ollama:
        condition: service_healthy
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - ollama pull "$$OLLAMA_MODEL"
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  alert-service:
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      ASSISTANT_MODE: OLLAMA
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      ASSISTANT_READ_TIMEOUT: 45s

volumes:
  ollama-data:
