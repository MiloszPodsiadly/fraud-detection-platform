          path: |
            alert-service/target/surefire-reports/
            alert-service/target/failsafe-reports/
            alert-service/target/fdp36-chaos/

  fdp37-production-image-chaos:
    name: FDP-37 Production Image Chaos Proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - fdp36-real-chaos
      - regulated-mutation-regression
      - fdp35-production-readiness

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Verify Docker is available for production-image chaos
        run: docker version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: |
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Build alert-service production-like image
        id: build-fdp37-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/Dockerfile.backend
          push: false
          load: true
          pull: true
          no-cache: true
          tags: fdp37-alert-service:${{ github.sha }}
          build-args: |
            MODULE_NAME=alert-service

      - name: Scan FDP-37 production-like image and save SBOM evidence
        uses: ./.github/actions/scan-built-image
        with:
          image-ref: fdp37-alert-service:${{ github.sha }}
          build-digest: ${{ steps.build-fdp37-image.outputs.digest }}
          build-metadata: ${{ steps.build-fdp37-image.outputs.metadata }}
          artifact-name: fdp37-alert-service-image-security
          output-directory: alert-service/target/fdp37-image-security

      - name: Record production-like image identity
        run: |
          IMAGE_ID=$(docker image inspect fdp37-alert-service:${GITHUB_SHA} --format '{{.Id}}')
          IMAGE_DIGEST_OR_ID=$(docker image inspect fdp37-alert-service:${GITHUB_SHA} --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}')
          echo "FDP37_ALERT_SERVICE_IMAGE=fdp37-alert-service:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FDP37_ALERT_SERVICE_IMAGE_ID=${IMAGE_ID}" >> "$GITHUB_ENV"
          echo "FDP37_ALERT_SERVICE_IMAGE_DIGEST=${IMAGE_DIGEST_OR_ID}" >> "$GITHUB_ENV"
          echo "Built FDP-37 image fdp37-alert-service:${GITHUB_SHA} with image id ${IMAGE_ID} and digest/id ${IMAGE_DIGEST_OR_ID}"

      - name: Build patched Kafka image for Testcontainers
        uses: ./.github/actions/build-kafka-test-image

      - name: Run FDP-37 production image chaos suite
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dfdp37.alert-service.image=${FDP37_ALERT_SERVICE_IMAGE}" "-Dfdp37.alert-service.image-id=${FDP37_ALERT_SERVICE_IMAGE_ID}" "-Dfdp37.alert-service.image-digest=${FDP37_ALERT_SERVICE_IMAGE_DIGEST}" "-Dgroups=fdp37,production-image-chaos,docker-chaos,integration" "-Dtest=RegulatedMutationProductionImageChaosIT,RegulatedMutationProductionImageEvidenceIntegrityIT,RegulatedMutationProductionImageConfigParityIT,RegulatedMutationProductionImageRollbackIT,RegulatedMutationProductionImageRequiredTransactionChaosIT" test
        env:
          REGULATED_MUTATION_REGRESSION_STATUS: PASS
          FDP35_STATUS: PASS
          FDP36_STATUS: PASS

      - name: Verify FDP-37 proof artifacts
        if: always()
        run: node scripts/ci/verify-fdp37-artifacts.mjs

      - name: Package FDP-37 production image chaos artifacts
        if: always()
        run: |
          ARCHIVE=alert-service/target/fdp37-production-image-chaos-reports.tar.gz
          paths=()
          for path in \
            alert-service/target/surefire-reports \
            alert-service/target/failsafe-reports \
            alert-service/target/fdp37-chaos
          do
            if [ -e "$path" ]; then
              paths+=("$path")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No FDP-37 artifact paths found to package" >&2
            exit 1
          fi
          tar -czf "$ARCHIVE" "${paths[@]}"
          test -s "$ARCHIVE"
          echo "Packaged FDP-37 artifacts into $ARCHIVE"

      - name: Upload FDP-37 production image chaos artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp37-production-image-chaos-reports
          if-no-files-found: error
          path: alert-service/target/fdp37-production-image-chaos-reports.tar.gz

