name: Scan built image and generate SBOM evidence
description: Scan a local image, create a CycloneDX SBOM, and upload the evidence.
inputs:
  image-ref:
    description: Image reference loaded into the Docker daemon.
    required: true
  build-digest:
    description: Digest reported by docker/build-push-action.
    required: false
    default: ''
  build-metadata:
    description: Metadata JSON reported by docker/build-push-action.
    required: false
    default: ''
  expected-platform:
    description: Required platform of the image loaded for scanning.
    required: false
    default: linux/amd64
  artifact-name:
    description: Unique suffix for the uploaded evidence artifact.
    required: true
  output-directory:
    description: Directory for image scan and SBOM files.
    required: false
    default: target/image-security
runs:
  using: composite
  steps:
    - name: Record tested revision and scanned image digest
      id: image-evidence
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        BUILD_DIGEST: ${{ inputs.build-digest }}
        BUILD_METADATA_JSON: ${{ inputs.build-metadata }}
        EXPECTED_PLATFORM: ${{ inputs.expected-platform }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        EXPECTED_GIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        actual_git_sha="$(git rev-parse HEAD)"
        test "$actual_git_sha" = "$EXPECTED_GIT_SHA"
        image_id_digest="$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
        [[ "$image_id_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
        image_platform="$(docker image inspect "$IMAGE_REF" --format '{{.Os}}/{{.Architecture}}')"
        [[ "$image_platform" =~ ^[a-z0-9]+/[a-z0-9_]+$ ]]
        test "$image_platform" = "$EXPECTED_PLATFORM"
        repo_digests="$(docker image inspect "$IMAGE_REF" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
        scanned_identity_source=""
        buildx_config_digest=""
        source_image_digest=""
        source_manifest_media_type=""
        platform_manifest_digest=""
        platform_manifest_media_type=""
        platform_config_digest=""
        if [[ -n "$BUILD_METADATA_JSON" ]]; then
          metadata_digests="$(node -e 'const m=JSON.parse(process.env.BUILD_METADATA_JSON); const manifest=m["containerimage.digest"]; const config=m["containerimage.config.digest"]; if (!manifest || !config) process.exit(2); process.stdout.write(`${manifest}\n${config}\n`);')"
          buildx_manifest_digest="$(printf '%s\n' "$metadata_digests" | sed -n '1p')"
          buildx_config_digest="$(printf '%s\n' "$metadata_digests" | sed -n '2p')"
          [[ "$buildx_manifest_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$buildx_config_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$image_id_digest" = "$buildx_config_digest" ]]
          [[ "$BUILD_DIGEST" = "$buildx_manifest_digest" ]]
          scanned_image_digest="$buildx_manifest_digest"
          scanned_identity_source="buildx-manifest-verified-against-image-id"
          source_image_digest="$buildx_manifest_digest"
          source_manifest_media_type="buildx-output-manifest"
          platform_manifest_digest="$buildx_manifest_digest"
          platform_manifest_media_type="buildx-output-manifest"
          platform_config_digest="$buildx_config_digest"
        elif [[ "$IMAGE_REF" == *@sha256:* ]]; then
          registry_identity="$(node scripts/ci/inspect-pinned-image-platform.mjs "$IMAGE_REF" "$EXPECTED_PLATFORM" "$image_id_digest")"
          identity_fields="$(IDENTITY_JSON="$registry_identity" node -e 'const i=JSON.parse(process.env.IDENTITY_JSON); process.stdout.write([i.sourceImageDigest,i.sourceManifestMediaType,i.platformManifestDigest,i.platformManifestMediaType,i.platformConfigDigest].join("\n"));')"
          source_image_digest="$(printf '%s\n' "$identity_fields" | sed -n '1p')"
          source_manifest_media_type="$(printf '%s\n' "$identity_fields" | sed -n '2p')"
          platform_manifest_digest="$(printf '%s\n' "$identity_fields" | sed -n '3p')"
          platform_manifest_media_type="$(printf '%s\n' "$identity_fields" | sed -n '4p')"
          platform_config_digest="$(printf '%s\n' "$identity_fields" | sed -n '5p')"
          [[ "$source_image_digest" = "${IMAGE_REF##*@}" ]]
          [[ "$platform_config_digest" = "$image_id_digest" ]]
          scanned_image_digest="$source_image_digest"
          scanned_identity_source="immutable-image-reference"
        elif [[ "$IMAGE_REF" == "apache/kafka:4.4.0-temurin-25.0.5.1_2" || "$IMAGE_REF" == "fdp-local/node-builder:26.13.1-npm12.2.3" ]]; then
          scanned_image_digest="$image_id_digest"
          scanned_identity_source="docker-image-id"
          source_image_digest="$image_id_digest"
          source_manifest_media_type="local-image-config"
          platform_manifest_media_type="local-image-config"
          platform_config_digest="$image_id_digest"
        else
          echo "No immutable image digest is available for $IMAGE_REF" >&2
          exit 1
        fi
        [[ "$scanned_image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
        mkdir -p "$OUTPUT_DIRECTORY"
        export TESTED_GIT_SHA="$actual_git_sha" IMAGE_ID_DIGEST="$image_id_digest" IMAGE_PLATFORM="$image_platform" SCANNED_IMAGE_DIGEST="$scanned_image_digest" REPO_DIGESTS="$repo_digests" BUILDX_CONFIG_DIGEST="$buildx_config_digest" SOURCE_IMAGE_DIGEST="$source_image_digest" SOURCE_MANIFEST_MEDIA_TYPE="$source_manifest_media_type" PLATFORM_MANIFEST_DIGEST="$platform_manifest_digest" PLATFORM_MANIFEST_MEDIA_TYPE="$platform_manifest_media_type" PLATFORM_CONFIG_DIGEST="$platform_config_digest"
        export SCANNED_IDENTITY_SOURCE="$scanned_identity_source"
        node -e 'const fs=require("node:fs"); const p=process.env.OUTPUT_DIRECTORY + "/image-security-evidence.json"; fs.writeFileSync(p, JSON.stringify({testedGitSha:process.env.TESTED_GIT_SHA,imageRef:process.env.IMAGE_REF,imagePlatform:process.env.IMAGE_PLATFORM,scannedImageDigest:process.env.SCANNED_IMAGE_DIGEST,scannedImageIdentitySource:process.env.SCANNED_IDENTITY_SOURCE,imageIdDigest:process.env.IMAGE_ID_DIGEST,repoDigests:process.env.REPO_DIGESTS.split("\n").filter(Boolean),sourceImageDigest:process.env.SOURCE_IMAGE_DIGEST,sourceManifestMediaType:process.env.SOURCE_MANIFEST_MEDIA_TYPE,platformManifestDigest:process.env.PLATFORM_MANIFEST_DIGEST || null,platformManifestMediaType:process.env.PLATFORM_MANIFEST_MEDIA_TYPE,platformConfigDigest:process.env.PLATFORM_CONFIG_DIGEST,buildxDigest:process.env.BUILD_DIGEST || null,buildxConfigDigest:process.env.BUILDX_CONFIG_DIGEST || null}, null, 2) + "\n");'

    - name: Scan image for high and critical vulnerabilities
      id: trivy-scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        version: v0.76.2
        cache: false
        scanners: vuln
        vuln-type: os,library
        format: json
        output: ${{ inputs.output-directory }}/trivy-image.json
        severity: HIGH,CRITICAL
        timeout: 15m
        exit-code: '1'

    - name: Generate CycloneDX SBOM for the built image
      if: always() && steps.image-evidence.outcome == 'success'
      id: image-sbom
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ inputs.image-ref }}
        format: cyclonedx-json
        output-file: ${{ inputs.output-directory }}/image.cdx.json
        syft-version: v1.57.2
        upload-artifact: false
        upload-release-assets: false

    - name: Bind CycloneDX SBOM to the scanned image identity
      if: always() && steps.image-sbom.outcome == 'success' && steps.image-evidence.outcome == 'success'
      id: image-sbom-binding
      shell: bash
      env:
        EVIDENCE_PATH: ${{ inputs.output-directory }}/image-security-evidence.json
        SBOM_PATH: ${{ inputs.output-directory }}/image.cdx.json
      run: node scripts/ci/bind-image-sbom-identity.mjs "$SBOM_PATH" "$EVIDENCE_PATH"

    - name: Record image scan and SBOM execution outcomes
      if: always() && steps.image-evidence.outcome == 'success'
      shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        EVIDENCE_OUTCOME: ${{ steps.image-evidence.outcome }}
        TRIVY_OUTCOME: ${{ steps.trivy-scan.outcome }}
        SBOM_OUTCOME: ${{ steps.image-sbom.outcome }}
        SBOM_BINDING_OUTCOME: ${{ steps.image-sbom-binding.outcome }}
        SCANNER_VERSION: v0.76.2
        SBOM_GENERATOR_VERSION: v1.57.2
      run: |
        node -e 'const fs=require("node:fs"); const evidence=JSON.parse(fs.readFileSync(process.env.OUTPUT_DIRECTORY + "/image-security-evidence.json", "utf8")); const result={testedGitSha:evidence.testedGitSha,imageRef:evidence.imageRef,imagePlatform:evidence.imagePlatform,imageIdDigest:evidence.imageIdDigest,scannedImageDigest:evidence.scannedImageDigest,scannedImageIdentitySource:evidence.scannedImageIdentitySource,repoDigests:evidence.repoDigests,sourceImageDigest:evidence.sourceImageDigest,sourceManifestMediaType:evidence.sourceManifestMediaType,platformManifestDigest:evidence.platformManifestDigest,platformManifestMediaType:evidence.platformManifestMediaType,platformConfigDigest:evidence.platformConfigDigest,buildxDigest:evidence.buildxDigest,buildxConfigDigest:evidence.buildxConfigDigest,scanner:{name:"trivy",version:process.env.SCANNER_VERSION,outcome:process.env.TRIVY_OUTCOME,policy:"HIGH,CRITICAL"},sbom:{format:"CycloneDX JSON",generator:"syft",version:process.env.SBOM_GENERATOR_VERSION,outcome:process.env.SBOM_OUTCOME,bindingOutcome:process.env.SBOM_BINDING_OUTCOME}}; fs.writeFileSync(process.env.OUTPUT_DIRECTORY + "/image-scan-result.json", JSON.stringify(result,null,2)+"\n");'

    - name: Upload image security evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}-${{ github.sha }}
        path: ${{ inputs.output-directory }}
        if-no-files-found: error
        retention-days: 30
