name: Resolved SBOM

on:
  pull_request:
    paths:
      - .github/workflows/sbom.yml
      - scripts/ci/install-pinned-npm.sh
      - scripts/ci/install-pinned-cyclonedx-bom.sh
      - scripts/ci/validate-sbom-artifacts.mjs
      - deployment/Dockerfile.ml-inference
      - deployment/python-build-tools-requirements.txt
      - pom.xml
      - '**/pom.xml'
      - analyst-console-ui/package.json
      - analyst-console-ui/package-lock.json
      - ml-inference-service/requirements.txt
  push:
    branches:
      - master
    paths:
      - .github/workflows/sbom.yml
      - scripts/ci/install-pinned-npm.sh
      - scripts/ci/install-pinned-cyclonedx-bom.sh
      - scripts/ci/validate-sbom-artifacts.mjs
      - deployment/Dockerfile.ml-inference
      - deployment/python-build-tools-requirements.txt
      - pom.xml
      - '**/pom.xml'
      - analyst-console-ui/package.json
      - analyst-console-ui/package-lock.json
      - ml-inference-service/requirements.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolved-sbom:
    name: Generate resolved CycloneDX SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: analyst-console-ui/package-lock.json

      - name: Install verified patched npm
        run: bash scripts/ci/install-pinned-npm.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
          pip-version: '26.3'
          cache: pip
          cache-dependency-path: ml-inference-service/requirements.txt

      - name: Generate Maven resolved SBOM
        run: |
          mkdir -p target/sbom
          find . -name pom.xml -not -path './.git/*' -print0 \
            | while IFS= read -r -d '' pom; do mkdir -p "$(dirname "$pom")/target"; done
          mvn -B -DskipTests \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
            -DoutputType=text \
            -DoutputFile=target/maven-dependency-tree.txt
          mvn -B -DskipTests \
            -Dproject.build.outputTimestamp=0 \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom \
            -DschemaVersion=1.6 \
            -DoutputFormat=json \
            -DoutputName=maven-resolved \
            -DoutputDirectory=target/sbom \
            -DincludeBomSerialNumber=false \
            -DincludeTestScope=true \
            -DoutputReactorProjects=false
          mv target/sbom/maven-resolved.json target/sbom/maven-resolved.cdx.json

      - name: Generate npm resolved SBOM
        working-directory: analyst-console-ui
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@7.0.1 \
            --package-lock-only \
            --output-reproducible \
            --spec-version 1.6 \
            --output-format JSON \
            --validate \
            --output-file ../target/sbom/npm-analyst-console-ui.cdx.json \
            package.json

      - name: Generate Python resolved SBOM
        run: |
          python -m venv .venv-sbom-ml
          .venv-sbom-ml/bin/python -m pip install --upgrade --require-hashes --no-deps -r deployment/python-build-tools-requirements.txt
          .venv-sbom-ml/bin/python -m pip install --require-hashes --only-binary=:all: -r ml-inference-service/requirements.txt
          bash scripts/ci/install-pinned-cyclonedx-bom.sh
          cyclonedx-py environment \
            --output-reproducible \
            --validate \
            --sv 1.6 \
            --of JSON \
            -o target/sbom/python-ml-inference-service.cdx.json \
            .venv-sbom-ml/bin/python

      - name: Validate SBOM artifacts
        env:
          TESTED_GIT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_GIT_SHA"
          node scripts/ci/validate-sbom-artifacts.mjs target/sbom/*.cdx.json

      - name: Upload resolved SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-cyclonedx-sbom-${{ github.sha }}
          path: |
            target/sbom/*.json
            **/target/maven-dependency-tree.txt
          if-no-files-found: error
          retention-days: 30
