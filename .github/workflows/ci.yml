          version: v0.39.0
          driver-opts: |
            image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Build and export release image filesystem
        id: build-fdp39-release-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/Dockerfile.backend
          push: false
          load: true
          pull: true
          no-cache: true
          tags: fdp39-alert-service:${{ github.sha }}
          build-args: |
            MODULE_NAME=alert-service

      - name: Scan FDP-39 release image and save SBOM evidence
        uses: ./.github/actions/scan-built-image
        with:
          image-ref: fdp39-alert-service:${{ github.sha }}
          build-digest: ${{ steps.build-fdp39-release-image.outputs.digest }}
          build-metadata: ${{ steps.build-fdp39-release-image.outputs.metadata }}
          artifact-name: fdp39-release-image-security
          output-directory: alert-service/target/fdp39-governance/image-security/release

      - name: Export release image filesystem
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker image inspect fdp39-alert-service:${GITHUB_SHA} --format '{{.Id}}')
          IMAGE_DIGEST_OR_ID=$(docker image inspect fdp39-alert-service:${GITHUB_SHA} --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}')
          test -n "$IMAGE_ID"
          test -n "$IMAGE_DIGEST_OR_ID"
          mkdir -p alert-service/target/fdp39-governance/release-image-root
          CONTAINER_ID=$(docker create fdp39-alert-service:${GITHUB_SHA})
          docker export "$CONTAINER_ID" -o alert-service/target/fdp39-governance/release-image.tar
          docker rm "$CONTAINER_ID"
          tar -xf alert-service/target/fdp39-governance/release-image.tar -C alert-service/target/fdp39-governance/release-image-root
          if find alert-service/target/fdp39-governance/release-image-root -path '*target/test-classes*' -print -quit | grep -q .; then
            echo "FDP-39 release image contains test classes"
            exit 1
          fi
          if grep -R -a -E 'LiveRuntimeCheckpointBarrierConfiguration|fdp38-live-runtime-checkpoint|LiveRuntimeCheckpoint|LIVE_IN_FLIGHT_REQUEST_KILL|RUNTIME_REACHED_TEST_FIXTURE|Dockerfile.alert-service-fdp38-fixture' alert-service/target/fdp39-governance/release-image-root; then
            echo "FDP-39 release image contains FDP-38 fixture/test code"
            exit 1
          fi
          echo "FDP39_RELEASE_IMAGE=fdp39-alert-service:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FDP39_RELEASE_IMAGE_ID=${IMAGE_ID}" >> "$GITHUB_ENV"
          echo "FDP39_RELEASE_IMAGE_DIGEST=${IMAGE_DIGEST_OR_ID}" >> "$GITHUB_ENV"

      - name: Build fixture image only for non-release provenance
        id: build-fdp39-fixture-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/Dockerfile.alert-service-fdp38-fixture
          push: false
          load: true
          pull: true
          no-cache: true
          tags: fdp38-alert-service-test-fixture:${{ github.sha }}

      - name: Scan FDP-39 fixture image and save SBOM evidence
        uses: ./.github/actions/scan-built-image
        with:
          image-ref: fdp38-alert-service-test-fixture:${{ github.sha }}
          build-digest: ${{ steps.build-fdp39-fixture-image.outputs.digest }}
          build-metadata: ${{ steps.build-fdp39-fixture-image.outputs.metadata }}
          artifact-name: fdp39-fixture-image-security
          output-directory: alert-service/target/fdp39-governance/image-security/fixture

      - name: Record FDP-39 fixture image identity
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker image inspect fdp38-alert-service-test-fixture:${GITHUB_SHA} --format '{{.Id}}')
          IMAGE_DIGEST_OR_ID=$(docker image inspect fdp38-alert-service-test-fixture:${GITHUB_SHA} --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}')
          test -n "$IMAGE_ID"
          test -n "$IMAGE_DIGEST_OR_ID"
          echo "FDP39_FIXTURE_IMAGE=fdp38-alert-service-test-fixture:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FDP39_FIXTURE_IMAGE_ID=${IMAGE_ID}" >> "$GITHUB_ENV"
          echo "FDP39_FIXTURE_IMAGE_DIGEST=${IMAGE_DIGEST_OR_ID}" >> "$GITHUB_ENV"

      - name: Generate FDP-39 CI governance artifacts
        run: bash scripts/fdp39-generate-governance-artifacts.sh
        env:
          RELEASE_IMAGE_NAME: ${{ env.FDP39_RELEASE_IMAGE }}
          RELEASE_IMAGE_ID: ${{ env.FDP39_RELEASE_IMAGE_ID }}
          RELEASE_IMAGE_DIGEST: ${{ env.FDP39_RELEASE_IMAGE_DIGEST }}
          RELEASE_IMAGE_SCAN_ROOT: alert-service/target/fdp39-governance/release-image-root
          FIXTURE_IMAGE_NAME: ${{ env.FDP39_FIXTURE_IMAGE }}
          FIXTURE_IMAGE_ID: ${{ env.FDP39_FIXTURE_IMAGE_ID }}
          FIXTURE_IMAGE_DIGEST: ${{ env.FDP39_FIXTURE_IMAGE_DIGEST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Run FDP-39 governance tests
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dfdp39.ci-mode=true" "-Dfdp39.event-name=${FDP39_EVENT_NAME}" "-Dfdp39.base-sha=${FDP39_DIFF_BASE_SHA}" "-Dfdp39.head-sha=${FDP39_DIFF_HEAD_SHA}" "-Dfdp39.release-image.scan-root=target/fdp39-governance/release-image-root" "-Dfdp39.commit-sha=${GITHUB_SHA}" "-Dfdp39.branch-name=${GITHUB_REF_NAME}" "-Dfdp39.github-run-id=${GITHUB_RUN_ID}" "-Dfdp39.github-workflow=${GITHUB_WORKFLOW}" "-Dfdp39.release-image.name=${FDP39_RELEASE_IMAGE}" "-Dfdp39.release-image.id=${FDP39_RELEASE_IMAGE_ID}" "-Dfdp39.release-image.digest=${FDP39_RELEASE_IMAGE_DIGEST}" "-Dfdp39.fixture-image.name=${FDP39_FIXTURE_IMAGE}" "-Dfdp39.fixture-image.id=${FDP39_FIXTURE_IMAGE_ID}" "-Dfdp39.fixture-image.digest=${FDP39_FIXTURE_IMAGE_DIGEST}" "-Dtest=RegulatedMutationReleaseImageSeparationTest,FixtureDockerfileMustNotBeUsedByReleaseWorkflowTest,ReleaseGovernanceArtifactsTest,ReleaseGovernanceNoOverclaimDocumentationTest,ReleaseGovernanceRuntimeIsolationTest,RegulatedMutationRecoveryInspectionGovernanceTest" test

      - name: Verify FDP-39 governance artifacts
        if: always()
        run: node scripts/ci/verify-fdp39-artifacts.mjs

      - name: Upload FDP-39 release governance artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp39-release-governance-reports
          if-no-files-found: error
          path: |
            alert-service/target/surefire-reports/
            alert-service/target/fdp39-governance/fdp39-*.json
            alert-service/target/fdp39-governance/fdp39-*.md

  fdp-image-scan-evidence:
    name: Aggregate FDP-37/38/39 image scan evidence
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fdp37-production-image-chaos
      - fdp38-live-runtime-checkpoint-chaos
      - fdp39-release-governance
    env:
      TESTED_GIT_SHA: ${{ github.sha }}
      IMAGE_SCAN_JOB_RESULTS: >-
        {"fdp37":"${{ needs.fdp37-production-image-chaos.result }}","fdp38":"${{ needs.fdp38-live-runtime-checkpoint-chaos.result }}","fdp39":"${{ needs.fdp39-release-governance.result }}"}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Exercise image inventory and evidence rejection cases
        run: node --test scripts/ci/check-image-scan-coverage.test.mjs scripts/ci/validate-image-scan-evidence.test.mjs scripts/ci/verify-buildx-image-metadata.test.mjs

      - name: Derive expected FDP image scan inventory
        run: node scripts/ci/check-image-scan-coverage.mjs --write-ci-inventory target/image-security/expected-inventory.json

      - name: Download FDP image scan artifacts for this revision
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-security-${{ github.sha }}'
          path: target/image-security/downloads

      - name: Validate complete FDP image scans and SBOMs
        if: always()
        run: node scripts/ci/validate-image-scan-evidence.mjs target/image-security/expected-inventory.json target/image-security/downloads

      - name: Upload FDP image scan evidence validation summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp-image-scan-validation-${{ github.sha }}
          path: target/image-security/validated-image-scan-summary.json
          if-no-files-found: ignore
          retention-days: 30

  fdp40-release-controls:
    name: FDP-40 Release Controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FDP40_EVENT_NAME: ${{ github.event_name }}
      FDP40_DIFF_BASE_SHA: ${{ github.event.before || '' }}
      FDP40_DIFF_HEAD_SHA: ${{ github.sha }}
      FDP40_BASE_REF: ${{ github.base_ref || 'master' }}
    needs:
      - backend
      - docker
      - regulated-mutation-regression
      - fdp35-production-readiness
      - fdp36-real-chaos
      - fdp37-production-image-chaos
      - fdp38-live-runtime-checkpoint-chaos
      - fdp39-release-governance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up patched Java
        uses: ./.github/actions/setup-patched-java
        with:
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Run FDP-40 release controls tests
        run: mvn -B -pl alert-service -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Dfdp40.ci-mode=true" "-Dfdp40.event-name=${FDP40_EVENT_NAME}" "-Dfdp40.base-sha=${FDP40_DIFF_BASE_SHA}" "-Dfdp40.head-sha=${FDP40_DIFF_HEAD_SHA}" "-Dfdp40.base-ref=${FDP40_BASE_REF}" "-Dfdp40.release-manifest=../docs/release/fdp_40_release_manifest_template.yaml" "-Dfdp40.attestation=../docs/release/fdp_40_attestation_readiness_template.json" "-Dfdp40.fdp39-provenance=../docs/release/fdp_40_fdp39_provenance_reference.json" "-Dfdp40.required-checks-matrix=../docs/release/fdp_40_required_checks_matrix.json" "-Dtest=ReleaseManifestValidationTest,SignedProvenanceReadinessTest,ReleaseEvidenceVerificationTest,ReleaseEvidenceVerificationNegativeTest,RegistryPromotionPolicyTest,RegistryImmutabilityReadinessTest,RequiredChecksMatrixTest,EnvironmentProtectionGateTest,DeploymentEnvironmentReadinessTest,BranchProtectionReadinessTest,ExternalPlatformControlsMatrixTest,EnablementPrTemplateTest,SingleReleaseOwnerGovernanceTest,UnsupportedClaimsMatrixTest,ReleaseControlNoOverclaimDocumentationTest,ReleaseControlRuntimeIsolationTest,ReleaseControlFinalProofPackTest,SbomReadinessTest,CosignVerificationReadinessTest,ResidualPlatformGapsTest,ReleaseControlScriptExecutionReadinessTest,ReleaseControlLocalPathHygieneTest" test

      - name: Validate FDP-40 release manifest
        run: bash scripts/fdp40-validate-release-manifest.sh docs/release/fdp_40_release_manifest_template.yaml

      - name: Validate FDP-40 attestation readiness
        run: bash scripts/fdp40-validate-attestation-readiness.sh docs/release/fdp_40_attestation_readiness_template.json docs/release/fdp_40_release_manifest_template.yaml

      - name: Verify FDP-40 release evidence
        run: bash scripts/fdp40-verify-release-evidence.sh docs/release/fdp_40_release_manifest_template.yaml docs/release/fdp_40_attestation_readiness_template.json docs/release/fdp_40_fdp39_provenance_reference.json docs/release/fdp_40_required_checks_matrix.json

      - name: Verify FDP-40 cosign readiness mode
        run: bash scripts/fdp40-verify-cosign-signature.sh

      - name: Verify FDP-40 release controls artifacts
        if: always()
        run: node scripts/ci/verify-fdp40-artifacts.mjs

      - name: Upload FDP-40 release controls artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdp40-release-controls-reports
          if-no-files-found: error
          path: |
            alert-service/target/surefire-reports/
            alert-service/target/fdp40-release/fdp40-*.json
            alert-service/target/fdp40-release/fdp40-*.md
            target/fdp40-release/fdp40-*.json
            target/fdp40-release/fdp40-*.md

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - ml
      - frontend
      - fdp28-proof
      - fdp35-production-readiness
      - fdp36-real-chaos
      - fdp37-production-image-chaos
      - fdp38-live-runtime-checkpoint-chaos
      - fdp39-release-governance
      - analyst-console-frontend-architecture-gate
      - regulated-mutation-regression
      - frontend-dependency-audit
      - python-dependency-audit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate local identity fixtures for Compose overlays
        run: bash scripts/bootstrap-local-fixtures.sh

      - name: Validate compose file
        run: |
          docker compose --env-file deployment/.env.example \
            -f deployment/docker-compose.yml \
            -f deployment/docker-compose.dev.yml \
            -f deployment/docker-compose.oidc.yml \
            -f deployment/docker-compose.service-identity-mtls.yml \
            -f deployment/docker-compose.trust-authority-jwt.yml \
            -f deployment/docker-compose.hardened.yml \
            config --quiet
          docker compose --env-file deployment/.env.example \
            -f deployment/docker-compose.yml \
            -f deployment/docker-compose.dev.yml \
            -f deployment/docker-compose.oidc.yml \
            -f deployment/docker-compose.service-identity-mtls.yml \
            -f deployment/docker-compose.trust-authority-jwt.yml \
            -f deployment/docker-compose.hardened.yml \
            -f deployment/docker-compose.shadow-performance-generated.yml \
            config --quiet

      - name: Build compose images
        run: |
          docker compose --env-file deployment/.env.example \
            -f deployment/docker-compose.yml \
            -f deployment/docker-compose.dev.yml \
            -f deployment/docker-compose.oidc.yml \
            -f deployment/docker-compose.service-identity-mtls.yml \
            -f deployment/docker-compose.trust-authority-jwt.yml \
            -f deployment/docker-compose.hardened.yml \
            build
